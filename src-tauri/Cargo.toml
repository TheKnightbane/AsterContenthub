[package]
name = "aster-content-hub"
version = "0.1.0-alpha.5"
description = "Your world of stories"
authors = ["Aster"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
keyring = { version = "3", features = ["windows-native"] }
open = "5"
tokio = { version = "1", features = ["net", "time", "io-util"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }
roxmltree = "0.21"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
minisign-verify = "0.3"

