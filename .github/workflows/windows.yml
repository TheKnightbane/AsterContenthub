name: Windows alpha checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run player:prepare
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://aster-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release player::tests -- --include-ignored
      - run: npm run desktop:build -- --config src-tauri/tauri.unsigned.conf.json
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aster-Windows-alpha
          path: |
            src-tauri/target/release/aster-content-hub.exe
            src-tauri/target/release/player/
            src-tauri/target/release/bundle/nsis/*.exe
