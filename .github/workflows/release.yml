name: Publish signed Windows update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aster-signed-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run player:prepare
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://aster-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release player::tests -- --include-ignored
      - name: Build and sign Windows installer
        run: npm run desktop:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TRAKT_CLIENT_ID: ${{ vars.VITE_TRAKT_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify installer signature and rejection of tampering
        run: cargo test --manifest-path src-tauri/Cargo.toml --release updates::tests::signed_installer -- --include-ignored
      - name: Publish installer and update feed
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Aster-signed-release
          path: release/*
